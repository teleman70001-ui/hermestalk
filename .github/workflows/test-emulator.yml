name: Test on Emulator

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-emulator:
    runs-on: ubuntu-24.04-arm64
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK
        run: flutter build apk --debug --target-platform=android-arm64

      - name: Create Android Emulator (ARM64 native)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: arm64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim
          script: |
            echo "=== Emulator boot complete ==="
            adb shell "getprop sys.boot_completed" 2>/dev/null || echo "waiting..."
            sleep 15

            echo "=== Find built APK ==="
            ls build/app/outputs/flutter-apk/

            echo "=== Install APK (debug) ==="
            adb install -r build/app/outputs/flutter-apk/app-arm64-v8b-debug.apk || \
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "=== Launch app ==="
            adb shell "am start -n com.teleman70001.hermestalk/com.teleman70001.hermestalk.MainActivity"
            sleep 10

            echo "=== Check if app crashed ==="
            adb shell "ps -A | grep hermestalk || echo 'APP CRASHED — Process not running'"

            echo "=== Extract crash logcat ==="
            adb logcat -d -s Flutter,AndroidRuntime,CRASH,FlutterError *:E | tail -200

            echo "=== Full system log ==="
            adb logcat -d | grep -i 'hermestalk\|crash\|fatal\|exception\|error' | tail -100
