name: Test on Emulator (x86_64)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.32.4'
          channel: 'stable'

      - name: Install dependencies
        run: flutter pub get

      - name: Build debug APK (x86_64)
        run: flutter build apk --debug --target-platform=android-x64

      - name: Create Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          force-avd-creation: true
          emulator-options: -no-snapshot -no-window -no-audio -no-boot-anim
          script: |
            echo "=== Emulator ready ==="
            adb wait-for-device
            adb shell "getprop sys.boot_completed; echo BOOT_DONE"
            for i in {1..30}; do adb shell "getprop sys.boot_completed" | grep -q 1 && break; sleep 2; done

            echo "=== List build output ==="
            find build -name "app-debug.apk" -type f 2>/dev/null; ls build/app/outputs/flutter-apk/ 2>/dev/null

            echo "=== Install APK ==="
            adb install -r build/app/outputs/flutter-apk/app-debug.apk

            echo "=== Launch app ==="
            adb shell "am start -n com.teleman70001.hermestalk/com.teleman70001.hermestalk MainActivity"
            sleep 8

            echo "=== Check process ==="
            adb shell "ps -A | grep hermestalk || echo 'APP_CRASHED_PROCESS_NOT_RUNNING'"

            echo "=== Crash logcat ==="
            adb logcat -d -s Flutter,AndroidRuntime,CRASH,FlutterError *:E | tail -200

            echo "=== All error lines ==="
            adb logcat -d | grep -iE 'hermestalk|crash|fatal|exception|VM_ERROR|abort' | tail -100

            echo "=== DONE ==="
